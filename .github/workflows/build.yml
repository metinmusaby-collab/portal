name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Derle
        run: mvn -B -U package
      - name: Jar'ı yükle
        uses: actions/upload-artifact@v4
        with:
          name: PortalPlugin
          path: target/PortalPlugin.jar
